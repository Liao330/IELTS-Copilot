version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ielts-backend
    restart: unless-stopped
    environment:
      - CORS_ORIGINS=http://193.112.79.136:8391
    volumes:
      - ./backend-data:/app/data
    networks:
      - ielts-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ielts-frontend
    restart: unless-stopped
    networks:
      - ielts-net

  nginx:
    image: nginx:alpine
    container_name: ielts-nginx
    restart: unless-stopped
    ports:
      - "8391:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      - backend
      - frontend
    networks:
      - ielts-net

networks:
  ielts-net:
    driver: bridge
